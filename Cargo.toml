[package]
name = "nweb"
authors = ["nasyt", "NAS油条",]
version = "0.5.0"
edition = "2021"
description = "A lightweight and high-performance static Web service built with Rust language nweb"
readme = "README.md"
homepage = "https://nasyt.hoha.top"
repository = "https://github.com/nasyt233/nweb"
license = "MIT OR Apache-2.0"
keywords = ["nweb", "nasyt", "web",]

[dependencies]
warp = "0.3"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
urlencoding = "2.1"
chrono = "0.4"
mime_guess = "2.0"
sysinfo = "0.30"
base64 = "0.21"
clap = { version = "4.0", features = ["derive"] }