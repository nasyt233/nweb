[package]
name = "nweb"
authors = ["nasyt",]
version = "0.8.0"
edition = "2021"
description = "A minimalist file browser written in Rust-no configuration, out of the box. 一个用 Rust 编写的极简文件浏览器 —— 无需配置，开箱即用。"
readme = "README.md"
homepage = "https://nasyt.hoha.top"
repository = "https://github.com/nasyt233/nweb"
license = "MIT OR Apache-2.0"
keywords = ["nweb", "nasyt", "web",]

[dependencies]
warp = "0.3"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
urlencoding = "2.1"
chrono = "0.4"
mime_guess = "2.0"
sysinfo = "0.30"
base64 = "0.21"
clap = { version = "4.0", features = ["derive"] }

[[bin]]
name = "nweb"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
opt-level = "z"
codegen-units = 1
panic = "abort"